<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>उधारी हिसाब Pro</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f1f5f9;
 color:#172033;
}

header{
 background:#087f5b;
 color:white;
 padding:22px 20px;
}

header h1{
 margin:0;
 font-size:30px;
}

header p{
 margin:8px 0 0;
 font-size:17px;
}

.container{
 max-width:700px;
 margin:auto;
 padding:18px;
}

.cards{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:14px;
}

.card{
 background:#ecfdf5;
 border:2px solid #c7f3df;
 border-radius:22px;
 padding:22px;
}

.card small{
 font-size:19px;
}

.card b{
 display:block;
 font-size:30px;
 margin-top:8px;
}

.box{
 background:white;
 border-radius:24px;
 padding:25px;
 margin-top:18px;
 box-shadow:0 4px 15px #00000010;
}

h2{
 margin-top:0;
 font-size:27px;
}

input{
 width:100%;
 padding:16px;
 border:2px solid #d8dde3;
 border-radius:15px;
 font-size:18px;
 margin:7px 0;
}

button{
 width:100%;
 border:0;
 padding:16px;
 border-radius:15px;
 font-size:18px;
 font-weight:bold;
 margin-top:10px;
 cursor:pointer;
}

.primary{background:#087f5b;color:white}
.blue{background:#2563eb;color:white}
.red{background:#dc2626;color:white}
.gray{background:#e5e7eb;color:#172033}

.customer{
 border:2px solid #e5e7eb;
 border-radius:18px;
 padding:17px;
 margin-top:12px;
}

.customer h3{
 margin:0 0 6px;
 font-size:21px;
}

.amount{
 font-size:25px;
 font-weight:bold;
 color:#dc2626;
}

.hidden{display:none}

.history{
 background:#f8fafc;
 padding:12px;
 border-radius:12px;
 margin-top:10px;
}

.green{
 color:#087f5b;
}

@media(max-width:500px){
 .cards{grid-template-columns:1fr 1fr}
 header h1{font-size:27px}
}
</style>
</head>

<body>

<header>
<h1>📒 उधारी हिसाब Pro</h1>
<p>ग्राहक का पूरा हिसाब आसानी से संभालें</p>
</header>

<div class="container">

<div class="cards">
<div class="card">
<small>कुल ग्राहक</small>
<b id="totalCustomers">0</b>
</div>

<div class="card">
<small>कुल उधारी</small>
<b id="totalDebt">₹0</b>
</div>
</div>

<div class="box">
<h2>➕ नया ग्राहक</h2>

<input id="name" placeholder="ग्राहक का नाम">

<input id="phone" type="tel" maxlength="10"
placeholder="WhatsApp मोबाइल नंबर">

<button class="primary" onclick="addCustomer()">
ग्राहक जोड़ें
</button>
</div>

<div class="box">
<h2>🔎 ग्राहक खोजें</h2>

<input id="search"
placeholder="नाम या मोबाइल नंबर से खोजें"
oninput="showCustomers()">

<div id="customerList"></div>
</div>

<div class="box hidden" id="accountBox">

<h2>👤 ग्राहक का हिसाब</h2>

<div id="accountInfo"></div>

<input id="debtAmount" type="number"
placeholder="उधारी रकम ₹">

<button class="red" onclick="addDebt()">
➕ उधारी जोड़ें
</button>

<input id="paidAmount" type="number"
placeholder="जमा रकम ₹">

<button class="blue" onclick="addPayment()">
💰 जमा रकम दर्ज करें
</button>

<button class="primary" onclick="sendWhatsApp()">
📲 WhatsApp पर हिसाब भेजें
</button>

<button class="gray" onclick="closeAccount()">
बंद करें
</button>

<div id="history"></div>

</div>

</div>

<script>

let customers =
JSON.parse(localStorage.getItem("customers") || "[]");

let selectedCustomer = null;

function save(){
 localStorage.setItem("customers",JSON.stringify(customers));
 updateStats();
 showCustomers();
}

function updateStats(){

document.getElementById("totalCustomers").innerText =
customers.length;

let total = customers.reduce(
(sum,c)=>sum + Number(c.balance || 0),0
);

document.getElementById("totalDebt").innerText =
"₹" + total.toFixed(2);
}

function addCustomer(){

let name =
document.getElementById("name").value.trim();

let phone =
document.getElementById("phone").value.trim();

if(!name){
 alert("ग्राहक का नाम डालिए");
 return;
}

if(phone.length !== 10 || !/^[0-9]+$/.test(phone)){
 alert("सही 10 अंकों का मोबाइल नंबर डालिए");
 return;
}

let exists = customers.find(c=>c.phone===phone);

if(exists){
 alert("यह मोबाइल नंबर पहले से मौजूद है");
 return;
}

customers.push({
 id:Date.now(),
 name:name,
 phone:phone,
 balance:0,
 history:[]
});

document.getElementById("name").value="";
document.getElementById("phone").value="";

save();

alert("ग्राहक सफलतापूर्वक जुड़ गया ✅");
}

function showCustomers(){

let search =
document.getElementById("search").value
.toLowerCase().trim();

let list =
document.getElementById("customerList");

list.innerHTML="";

let filtered = customers.filter(c =>
c.name.toLowerCase().includes(search) ||
c.phone.includes(search)
);

if(filtered.length===0){
 list.innerHTML="<p>कोई ग्राहक नहीं मिला।</p>";
 return;
}

filtered.forEach(c=>{

let div=document.createElement("div");
div.className="customer";

div.innerHTML=`
<h3>👤 ${escapeHtml(c.name)}</h3>
<div>📱 ${c.phone}</div>
<div class="amount">बाकी: ₹${Number(c.balance).toFixed(2)}</div>
<button class="primary"
onclick="openAccount(${c.id})">
हिसाब खोलें
</button>
`;

list.appendChild(div);

});
}

function openAccount(id){

selectedCustomer =
customers.find(c=>c.id===id);

if(!selectedCustomer)return;

document.getElementById("accountBox")
.classList.remove("hidden");

renderAccount();

window.scrollTo({
top:document.getElementById("accountBox").offsetTop-20,
behavior:"smooth"
});
}

function renderAccount(){

let c=selectedCustomer;

document.getElementById("accountInfo").innerHTML=`
<div class="customer">
<h3>👤 ${escapeHtml(c.name)}</h3>
<div>📱 ${c.phone}</div>
<h3 class="amount">
बाकी उधारी: ₹${Number(c.balance).toFixed(2)}
</h3>
</div>
`;

let history =
document.getElementById("history");

if(!c.history || c.history.length===0){
 history.innerHTML="<p>अभी कोई लेन-देन नहीं है।</p>";
 return;
}

history.innerHTML="<h3>📋 लेन-देन</h3>";

[...c.history].reverse().forEach(h=>{

let row=document.createElement("div");
row.className="history";

row.innerHTML=`
<b>${h.type==="debt"?"🔴 उधारी":"🟢 जमा"}</b>
<br>
₹${Number(h.amount).toFixed(2)}
<br>
<small>${h.date}</small>
`;

history.appendChild(row);

});
}

function addDebt(){

let amount =
Number(document.getElementById("debtAmount").value);

if(!selectedCustomer)return;

if(!amount || amount<=0){
 alert("सही उधारी रकम डालिए");
 return;
}

selectedCustomer.balance += amount;

selectedCustomer.history.push({
 type:"debt",
 amount:amount,
 date:new Date().toLocaleString("hi-IN")
});

document.getElementById("debtAmount").value="";

save();
renderAccount();

alert("उधारी जोड़ दी गई ✅");
}

function addPayment(){

let amount =
Number(document.getElementById("paidAmount").value);

if(!selectedCustomer)return;

if(!amount || amount<=0){
 alert("सही जमा रकम डालिए");
 return;
}

if(amount > selectedCustomer.balance){
 alert("जमा रकम बाकी उधारी से ज्यादा है");
 return;
}

selectedCustomer.balance -= amount;

selectedCustomer.history.push({
 type:"paid",
 amount:amount,
 date:new Date().toLocaleString("hi-IN")
});

document.getElementById("paidAmount").value="";

save();
renderAccount();

alert("जमा रकम दर्ज हो गई ✅");
}

function sendWhatsApp(){

if(!selectedCustomer)return;

let c=selectedCustomer;

let message =
"नमस्ते "+c.name+" जी,%0A%0A"+
"📒 उधारी हिसाब%0A"+
"कुल बाकी उधारी: ₹"+
Number(c.balance).toFixed(2)+
"%0A%0Aधन्यवाद 🙏";

let phone="91"+c.phone;

window.open(
"https://wa.me/"+phone+"?text="+message,
"_blank"
);
}

function closeAccount(){

document.getElementById("accountBox")
.classList.add("hidden");

selectedCustomer=null;
}

function escapeHtml(text){

return text
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");
}

updateStats();
showCustomers();

</script>

</body>
</html>
