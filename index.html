<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>उधारी हिसाब Pro</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;font-family:Arial,sans-serif;
 background:#f1f5f9;color:#172033
}
header{
 background:#087f5b;color:white;padding:18px 15px;
 position:sticky;top:0;z-index:5;
 box-shadow:0 2px 8px #0002
}
header h1{margin:0;font-size:24px}
header p{margin:5px 0 0;font-size:13px;opacity:.9}

.container{padding:15px;max-width:650px;margin:auto}

.card{
 background:white;border-radius:16px;padding:15px;
 margin-bottom:14px;
 box-shadow:0 3px 12px #0001
}

input,select,button{
 width:100%;padding:13px;margin:6px 0;
 border:1px solid #d5dce5;border-radius:10px;
 font-size:16px
}
button{
 border:0;background:#087f5b;color:white;
 font-weight:bold;cursor:pointer
}
button.secondary{background:#334155}
button.danger{background:#dc2626}
button.whatsapp{background:#16a34a}

.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.stats{
 display:grid;grid-template-columns:1fr 1fr;gap:10px
}
.stat{
 padding:15px;border-radius:14px;
 background:#ecfdf5;border:1px solid #bbf7d0
}
.stat b{display:block;font-size:20px;margin-top:5px}

.customer{
 border:1px solid #e2e8f0;border-radius:13px;
 padding:13px;margin-top:10px
}
.customer h3{margin:0 0 5px}
.amount{font-size:21px;font-weight:bold;color:#dc2626}
.small{font-size:13px;color:#64748b}

.hidden{display:none}
.empty{text-align:center;color:#64748b;padding:25px}
</style>
</head>

<body>

<header>
<h1>📒 उधारी हिसाब Pro</h1>
<p>ग्राहक का पूरा हिसाब आसानी से संभालें</p>
</header>

<div class="container">

<div class="stats">
<div class="stat">
कुल ग्राहक
<b id="totalCustomers">0</b>
</div>
<div class="stat">
कुल उधारी
<b id="totalDue">₹0</b>
</div>
</div>

<div class="card">
<h2>➕ नया ग्राहक</h2>

<input id="name" placeholder="ग्राहक का नाम">
<input id="phone" placeholder="WhatsApp मोबाइल नंबर" type="tel">

<button onclick="addCustomer()">ग्राहक जोड़ें</button>
</div>

<div class="card">
<h2>🔎 ग्राहक खोजें</h2>
<input id="search" placeholder="नाम या मोबाइल नंबर से खोजें"
oninput="showCustomers()">
</div>

<div id="customers"></div>

</div>

<script>
let customers=JSON.parse(localStorage.getItem("udhariCustomers")||"[]");

function save(){
 localStorage.setItem("udhariCustomers",JSON.stringify(customers));
}

function money(n){
 return "₹"+Number(n||0).toLocaleString("en-IN",{
 maximumFractionDigits:2
 });
}

  return;
 }
