<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#087f6f">
<title>उधारी हिसाब Pro</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#eef3f7;
 color:#222;
}

header{
 background:linear-gradient(135deg,#087f6f,#19a58f);
 color:white;
 text-align:center;
 padding:24px 12px;
}

header h1{
 margin:0;
 font-size:29px;
}

header p{
 margin:8px 0 0;
 font-size:16px;
}

.wrap{
 max-width:760px;
 margin:18px auto;
 padding:0 12px;
}

.nav{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:8px;
 margin-bottom:18px;
}

.nav button{
 background:#e4e9ed;
 color:#222;
 border:0;
 border-radius:13px;
 padding:13px 5px;
 font-weight:bold;
 font-size:15px;
}

.nav button.active{
 background:#087f6f;
 color:white;
}

.card{
 background:white;
 border-radius:20px;
 padding:18px;
 margin-bottom:16px;
 box-shadow:0 4px 15px #0001;
}

h2{
 margin:0 0 16px;
 color:#087f6f;
}

label{
 display:block;
 font-weight:bold;
 margin:12px 0 6px;
}

input,select,textarea{
 width:100%;
 padding:13px;
 border:1px solid #ddd;
 border-radius:12px;
 font-size:16px;
}

textarea{
 min-height:75px;
}

.add{
 width:100%;
 margin-top:15px;
 padding:14px;
 border:0;
 border-radius:12px;
 background:#128c7e;
 color:white;
 font-size:17px;
 font-weight:bold;
}

.stats{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:10px;
}

.stat{
 padding:17px 10px;
 border-radius:15px;
 font-weight:bold;
 text-align:center;
 cursor:pointer;
}

.stat b{
 display:block;
 font-size:21px;
 margin-top:6px;
}

.red{
 background:#ffe8e8;
 color:#c62828;
}

.green{
 background:#e5f8ec;
 color:#16833d;
}

.blue{
 background:#e7f0ff;
 color:#1769aa;
}

.orange{
 background:#fff1dc;
 color:#c77700;
}

.customer{
 border:1px solid #ddd;
 border-radius:16px;
 padding:15px;
 margin-top:12px;
}

.customer h3{
 margin:0 0 6px;
}

.balance{
 font-size:21px;
 font-weight:bold;
 margin:9px 0;
}

.redtxt{color:#d32f2f}
.greentxt{color:#18864b}

.actions{
 display:flex;
 flex-wrap:wrap;
 gap:7px;
 margin-top:12px;
}

.actions button{
 flex:1 1 45%;
 padding:11px 8px;
 border:0;
 border-radius:10px;
 font-weight:bold;
}

.deposit{
 background:#1b9e55;
 color:white;
}

.whatsapp{
 background:#25d366;
 color:white;
}

.delete{
 background:#d32f2f;
 color:white;
}

.history{
 background:#1769aa;
 color:white;
}

.entry{
 border-left:5px solid #087f6f;
 background:#f7fafb;
 padding:13px;
 border-radius:10px;
 margin:10px 0;
}

.entry .date{
 color:#666;
 font-size:13px;
}

.empty{
 text-align:center;
 color:#777;
 padding:20px;
}

.small{
 color:#666;
 font-size:14px;
 margin-top:4px;
}

.hidden{
 display:none;
}

.back{
 background:#555;
 color:white;
 border:0;
 border-radius:10px;
 padding:10px 14px;
 margin-bottom:12px;
}

@media(max-width:600px){
 .nav button{
  font-size:13px;
 }
}
</style>
</head>

<body>

<header>
<h1>📒 Shree PrabhuRaj Indian Oil</h1>
<p>उधारी एवं दैनिक हिसाब प्रबंधन</p>
</header>

<div class="wrap">

<div class="nav">
<button class="active" onclick="showSection('dashboard',this)">डैशबोर्ड</button>
<button onclick="showSection('new',this)">नई एंट्री</button>
<button onclick="showSection('customers',this)">ग्राहक</button>
<button onclick="showSection('report',this)">रिपोर्ट</button>
</div>

<!-- DASHBOARD -->

<div id="dashboard">

<div class="card">
<h2>📊 आज का हिसाब</h2>

<div class="stats">

<div class="stat red" onclick="showTodayDebt()">
आज की उधारी
<b id="todayDebt">₹0</b>
</div>

<div class="stat green" onclick="showPayment('Cash')">
कैश
<b id="todayCash">₹0</b>
</div>

<div class="stat blue" onclick="showPayment('UPI')">
UPI / Paytm
<b id="todayUPI">₹0</b>
</div>

<div class="stat orange" onclick="showTodayCollection()">
आज की वसूली
<b id="todayCollection">₹0</b>
</div>

</div>
</div>

<div class="card">
<h2>💰 कुल स्थिति</h2>

<div class="stats">

<div class="stat red">
कुल उधारी
<b id="totalDebt">₹0</b>
</div>

<div class="stat green">
कुल जमा
<b id="totalPaid">₹0</b>
</div>

<div class="stat blue">
कुल बाकी
<b id="totalRemain">₹0</b>
</div>

<div class="stat orange">
कुल ग्राहक
<b id="totalCustomers">0</b>
