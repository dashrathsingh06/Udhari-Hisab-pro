<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Udhari Hisab Pro</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  color:#172033;
}
header{
  background:#146c43;
  color:white;
  padding:20px 16px;
  text-align:center;
  border-radius:0 0 22px 22px;
}
header h1{margin:0;font-size:26px}
header p{margin:6px 0 0;font-size:14px}

.container{padding:16px;max-width:600px;margin:auto}

.summary{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-bottom:18px;
}
.box{
  background:white;
  padding:16px;
  border-radius:16px;
  box-shadow:0 2px 10px #00000012;
}
.box h3{margin:0 0 8px;font-size:14px}
.amount{font-size:23px;font-weight:bold}
.green{color:#159447}
.red{color:#dc2626}

button{
  border:0;
  border-radius:12px;
  padding:12px 15px;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}
.add{
  width:100%;
  background:#146c43;
  color:white;
  margin-bottom:15px;
}

.search{
  width:100%;
  padding:13px;
  border:1px solid #ddd;
  border-radius:12px;
  font-size:16px;
  margin-bottom:15px;
}

.customer{
  background:white;
  padding:16px;
  margin-bottom:12px;
  border-radius:17px;
  box-shadow:0 2px 10px #00000012;
}
.customer-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.name{font-size:18px;font-weight:bold}
.phone{font-size:13px;color:#667085;margin-top:4px}

.status{
  margin-top:12px;
  padding:10px;
  border-radius:10px;
  font-weight:bold;
}
.status.paid{
  background:#dcfce7;
  color:#15803d;
}
.status.due{
  background:#fee2e2;
  color:#b91c1c;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:12px;
}
.whatsapp{background:#25D366;color:white}
.pay{background:#146c43;color:white}
.history{background:#e8eef5;color:#172033}
.delete{background:#fee2e2;color:#b91c1c}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:#0008;
  padding:20px;
  z-index:10;
}
.modal-content{
  background:white;
  max-width:500px;
  margin:50px auto;
  padding:20px;
  border-radius:20px;
}
.modal h2{margin-top:0}

input{
  width:100%;
  padding:13px;
  border:1px solid #ddd;
  border-radius:10px;
  margin:7px 0 12px;
  font-size:16px;
}
.save{background:#146c43;color:white;width:100%}
.close{background:#eee;width:100%;margin-top:8px}

.empty{
  text-align:center;
  padding:35px 10px;
  color:#777;
}
</style>
</head>

<body>

<header>
  <h1>💰 Udhari Hisab Pro</h1>
  <p>ग्राहकों का उधारी हिसाब आसानी से रखें</p>
</header>

<div class="container">

  <div class="summary">
    <div class="box">
      <h3>🟢 जमा</h3>
      <div class="amount green" id="totalPaid">₹0</div>
    </div>
    <div class="box">
      <h3>🔴 बाकी</h3>
      <div class="amount red" id="totalDue">₹0</div>
    </div>
  </div>

  <button class="add" onclick="openModal()">
    ➕ नया ग्राहक जोड़ें
  </button>

  <input
    class="search"
    id="search"
    placeholder="🔎 नाम या मोबाइल नंबर खोजें..."
    oninput="showCustomers()"
  >

  <div id="customerList"></div>

</div>

<div class="modal" id="modal">
  <div class="modal-content">
    <h2>➕ नया ग्राहक</h2>

    <label>ग्राहक का नाम</label>
    <input id="name" placeholder="जैसे: रामलाल">

    <label>मोबाइल नंबर</label>
    <input id="phone" type="tel" placeholder="जैसे: 9876543210">

    <label>कुल उधारी</label>
    <input id="amount" type="number" placeholder="जैसे: 500">

    <button class="save" onclick="addCustomer()">ग्राहक सेव करें</button>
    <button class="close" onclick="closeModal()">बंद करें</button>
  </div>
</div>

<script>
let customers = JSON.parse(localStorage.getItem("udhariCustomers") || "[]");

function saveData(){
  localStorage.setItem("udhariCustomers", JSON.stringify(customers));
}

function openModal(){
  document.getElementById("modal").style.display="block";
}

function closeModal(){
  document.getElementById("modal").style.display="none";
}

function addCustomer(){

  let name=document.getElementById("name").value.trim();
  let phone=document.getElementById("phone").value.trim();
  let amount=Number(document.getElementById("amount").value);

  if(!name || !phone || !amount){
    alert("कृपया नाम, मोबाइल नंबर और उधारी भरें।");
    return;
  }

  customers.push({
    id:Date.now(),
    name:name,
    phone:phone,
    total:amount,
    paid:0,
    history:[
      {
        type:"उधारी",
        amount:amount,
        date:new Date().toLocaleString("hi-IN")
      }
    ]
  });

  saveData();

  document.getElementById("name").value="";
  document.getElementById("phone").value="";
  document.getElementById("amount").value="";

  closeModal();
  showCustomers();
}

function addPayment(id){

  let customer=customers.find(c=>c.id===id);
  if(!customer)return;

  let due=customer.total-customer.paid;

  if(due<=0){
    alert("इस ग्राहक का कोई पैसा बाकी नहीं है।");
    return;
  }

  let payment=Number(prompt("कितना पैसा जमा हुआ?",due));

  if(!payment || payment<=0)return;

  if(payment>due){
    alert("जमा राशि बाकी रकम से ज्यादा नहीं हो सकती।");
    return;
  }

  customer.paid+=payment;

  customer.history.push({
    type:"जमा",
    amount:payment,
    date:new Date().toLocaleString("hi-IN")
  });

  saveData();
  showCustomers();
}

function sendWhatsApp(id){

  let c=customers.find(x=>x.id===id);
  if(!c)return;

  let due=c.total-c.paid;

  let message=
`नमस्ते ${c.name} जी 👋

आपका उधारी हिसाब:

कुल उधारी: ₹${c.total}
जमा: ₹${c.paid}
बाकी: ₹${due}

धन्यवाद 🙏
Udhari Hisab Pro`;

  let phone=c.phone.replace(/\D/g,"");

  if(phone.length===10){
    phone="91"+phone;
  }

  window.open(
    "https://wa.me/"+phone+"?text="+encodeURIComponent(message),
    "_blank"
  );
}

function showHistory(id){

  let c=customers.find(x=>x.id===id);
  if(!c)return;

  let text=`${c.name} का हिसाब\\n\\n`;

  c.history.forEach((h,i)=>{
    text+=(i+1)+". "+h.type+" : ₹"+h.amount+
    " ("+h.date+")\\n";
  });

  alert(text);
}

function deleteCustomer(id){

  if(!confirm("क्या आप इस ग्राहक को हटाना चाहते हैं?"))return;

  customers=customers.filter(c=>c.id!==id);

  saveData();
  showCustomers();
}

function showCustomers(){

  let list=document.getElementById("customerList");
  let search=document.getElementById("search").value.toLowerCase();

  let filtered=customers.filter(c=>
    c.name.toLowerCase().includes(search) ||
    c.phone.includes(search)
  );

  list.innerHTML="";

  if(filtered.length===0){
    list.innerHTML=
      '<div class="empty">👤 अभी कोई ग्राहक नहीं है।<br>ऊपर से नया ग्राहक जोड़ें।</div>';
  }

  filtered.forEach(c=>{

    let due=c.total-c.paid;
    let paid=due<=0;

    let div=document.createElement("div");
    div.className="customer";

    div.innerHTML=`

      <div class="customer-top">
        <div>
          <div class="name">👤 ${escapeHtml(c.name)}</div>
          <div class="phone">📱 ${escapeHtml(c.phone)}</div>
        </div>
      </div>

      <div class="status ${paid ? "paid
