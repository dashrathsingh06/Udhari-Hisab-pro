<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shree PrabhuRaj Indian Oil</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,"Noto Sans Devanagari",sans-serif;
  background:#eef3f7;
  color:#172033;
}
header{
  background:linear-gradient(135deg,#087f6b,#12a58e);
  color:white;
  padding:28px 20px;
  text-align:center;
}
header h1{
  margin:0;
  font-size:30px;
}
header p{
  margin:10px 0 0;
  font-size:18px;
}
nav{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  padding:18px 14px;
}
nav button{
  border:0;
  padding:15px 5px;
  border-radius:18px;
  background:#e5ebef;
  font-size:17px;
  font-weight:bold;
}
nav button.active{
  background:#078875;
  color:white;
}
.page{display:none;padding:0 15px 40px}
.page.active{display:block}

.card{
  background:white;
  border-radius:30px;
  padding:28px;
  margin-bottom:20px;
  box-shadow:0 5px 20px #0000000c;
}
h2{
  color:#087f6b;
  font-size:32px;
  margin-top:0;
}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
}
.stat{
  border-radius:25px;
  padding:22px;
  min-height:145px;
}
.stat h3{
  margin:0 0 15px;
  font-size:20px;
}
.stat b{
  font-size:30px;
}
.blue{background:#e3efff;color:#1769aa}
.green{background:#e2f8ea;color:#16823c}
.red{background:#ffe5e5;color:#c72d2d}
.yellow{background:#fff5cf;color:#8d6d00}

label{
  display:block;
  font-size:20px;
  font-weight:bold;
  margin:20px 0 8px;
}
input,select,textarea{
  width:100%;
  padding:18px;
  border:2px solid #dce1e5;
  border-radius:18px;
  font-size:18px;
  outline:none;
}
textarea{min-height:100px}

.btn{
  width:100%;
  border:0;
  border-radius:18px;
  padding:18px;
  margin-top:20px;
  background:#078875;
  color:white;
  font-size:20px;
  font-weight:bold;
}
.btn.greenbtn{background:#20c968}
.btn.redbtn{background:#df3030}

.customer{
  border:2px solid #ddd;
  border-left:7px solid #e03030;
  border-radius:25px;
  padding:20px;
  margin-top:18px;
}
.customer h3{
  font-size:23px;
  margin:0 0 8px;
}
.balance{
  color:#d12d2d;
  font-size:25px;
  font-weight:bold;
}
.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:15px;
}
.actions button{
  border:0;
  border-radius:18px;
  padding:15px 8px;
  font-size:17px;
  font-weight:bold;
  color:white;
  background:#1faa5b;
}
.actions button:nth-child(2){background:#20c968}
.actions button:nth-child(3){
  background:#078875;
  grid-column:1/3;
}
.transaction{
  background:white;
  border-radius:22px;
  padding:20px;
  margin-top:15px;
  border-left:7px solid #d92f2f;
}
.transaction .amount{
  font-size:28px;
  font-weight:bold;
}
.empty{
  text-align:center;
  color:#777;
  padding:30px;
}
</style>
</head>

<body>

<header>
  <h1>⛽ Shree PrabhuRaj Indian Oil</h1>
  <p>उधारी एवं दैनिक हिसाब प्रबंधन</p>
</header>

<nav>
  <button class="active" onclick="showPage('dashboard',this)">डैशबोर्ड</button>
  <button onclick="showPage('entry',this)">नई एंट्री</button>
  <button onclick="showPage('customers',this)">ग्राहक</button>
  <button onclick="showPage('reports',this)">रिपोर्ट</button>
</nav>

<!-- DASHBOARD -->
<section id="dashboard" class="page active">

<div class="card">
<h2>आज का हिसाब</h2>

<div class="grid">

<div class="stat blue">
<h3>कुल बिक्री</h3>
<b id="totalSales">₹0</b>
</div>

<div class="stat green">
<h3>कैश</h3>
<b id="totalCash">₹0</b>
</div>

<div class="stat blue">
<h3>UPI / Paytm</h3>
<b id="totalUpi">₹0</b>
</div>

<div class="stat red">
<h3>आज की उधारी</h3>
<b id="todayCredit">₹0</b>
</div>

<div class="stat green">
<h3>आज की वसूली</h3>
<b id="todayCollection">₹0</b>
</div>

<div class="stat yellow">
<h3>कुल बाकी</h3>
<b id="totalBalance">₹0</b>
</div>

</div>
</div>

<div class="card">
<h2>आज के लेन-देन</h2>
<div id="dashboardTransactions"></div>
</div>

</section>

<!-- ENTRY -->
<section id="entry" class="page">

<div class="card">
<h2>➕ नई एंट्री</h2>

<label>लेन-देन प्रकार</label>
<select id="type">
<option value="credit">उधारी</option>
<option value="collection">वसूली</option>
<option value="cash">कैश बिक्री</option>
<option value="upi">UPI / Paytm</option>
</select>

<label>ग्राहक का नाम</label>
<input id="name" placeholder="ग्राहक का नाम">

<label>मोबाइल नंबर</label>
<input id="mobile" type="tel" maxlength="10"
placeholder="10 अंकों का मोबाइल नंबर">

<label>रकम</label>
<input id="amount" type="number" placeholder="जैसे 500">

<label>नोट</label>
<textarea id="note"
placeholder="जैसे पेट्रोल, डीजल आदि..."></textarea>

<button class="btn" onclick="addEntry()">एंट्री सेव करें</button>

</div>
</section>

<!-- CUSTOMERS -->
<section id="customers" class="page">

<div class="card">
<h2>👥 ग्राहक और बाकी</h2>

<input id="search"
oninput="renderCustomers()"
placeholder="नाम / मोबाइल / वाहन खोजें...">

<div id="customerList"></div>
</div>

</section>

<!-- REPORT -->
<section id="reports" class="page">

<div class="card">
<h2>📊 रिपोर्ट</h2>

<label>तारीख</label>
<input type="date" id="reportDate"
onchange="renderReport()">

<div class="grid" style="margin-top:20px">

<div class="stat red">
<h3>उधारी</h3>
<b id="reportCredit">₹0</b>
</div>

<div class="stat green">
<h3>वसूली</h3>
<b id="reportCollection">₹0</b>
</div>

<div class="stat blue">
<h3>कैश</h3>
<b id="reportCash">₹0</b>
</div>

<div class="stat blue">
<h3>UPI / Paytm</h3>
<b id="reportUpi">₹0</b>
</div>

</div>

<h2 style="margin-top:35px">सभी लेन-देन</h2>
<div id="reportTransactions"></div>

</div>
</section>

<script>

let data = JSON.parse(localStorage.getItem("udhariData") || "[]");

const today = () => {
  let d = new Date();
  return d.toISOString().split("T")[0];
};

document.getElementById("reportDate").value = today();

function money(n){
  return "₹" + Number(n || 0).toLocaleString("en-IN");
}

function save(){
  localStorage.setItem("udhariData",JSON.stringify(data));
}

function showPage(id,btn){

  document.querySelectorAll(".page")
  .forEach(p=>p.classList.remove("active"));

  document.getElementById(id).classList.add("active");

  document.querySelectorAll("nav button")
  .forEach(b=>b.classList.remove("active"));

  btn.classList.add("active");

  if(id==="dashboard") renderDashboard();
  if(id==="customers") renderCustomers();
  if(id==="reports") renderReport();
}

function addEntry(){

  let type=document.getElementById("type").value;
  let name=document.getElementById("name").value.trim();
  let mobile=document.getElementById("mobile").value.trim();
  let amount=Number(document.getElementById("amount").value);
  let note=document.getElementById("note").value.trim();

  if(!name){
    alert("ग्राहक का नाम डालिए");
    return;
  }

  if(!amount || amount<=0){
    alert("सही रकम डालिए");
    return;
  }

  let item={
    id:Date.now(),
    date:today(),
    time:new Date().toLocaleTimeString("en-IN",{
      hour:"2-digit",
      minute:"2-digit"
    }),
    type,
    name,
    mobile,
    amount,
    note
  };

  data.push(item);
  save();

  alert("एंट्री सफलतापूर्वक सेव हो गई ✅");

  document.getElementById("name").value="";
  document.getElementById("mobile").value="";
  document.getElementById("amount").value="";
  document.getElementById("note").value="";

  renderDashboard();
}

function getCustomerBalance(name,mobile){

  let balance=0;

  data.forEach(x=>{

    if(x.name===name && x.mobile===mobile){

      if(x.type==="credit") balance+=x.amount;

      if(x.type==="collection") balance-=x.amount;
    }

  });

  return balance;
}

function renderDashboard(){

  let todayData=data.filter(x=>x.date===today());

  let credit=todayData
    .filter(x=>x.type==="credit")
    .reduce((a,b)=>a+b.amount,0);

  let collection=todayData
    .filter(x=>x.type==="collection")
    .reduce((a,b)=>a+b.amount,0);

  let cash=todayData
    .filter(x=>x.type==="cash")
    .reduce((a,b)=>a+b.amount,0);

  let upi=todayData
    .filter(x=>x.type==="upi")
    .reduce((a,b)=>a+b.amount,0);

  let totalBalance=data.reduce((sum,x)=>{

    if(x.type==="credit") return sum+x.amount;

    if(x.type==="collection") return sum-x.amount;

    return sum;

  },0);

  document.getElementById("totalSales").textContent=
    money(cash+upi);

  document.getElementById("totalCash").textContent=money(cash);

  document.getElementById("totalUpi").textContent=money(upi);

  document.getElementById("todayCredit").textContent=money(credit);

  document.getElementById("todayCollection").textContent=
    money(collection);

  document.getElementById("totalBalance").textContent=
    money(totalBalance);

  let box=document.getElementById("dashboardTransactions");

  if(!todayData.length){
    box.innerHTML='<div class="empty">आज कोई लेन-देन नहीं है</div>';
    return;
  }

  box.innerHTML=todayData
  .slice()
  .reverse()
  .map(transactionHTML)
  .join("");
}

function transactionHTML(x){

  let title=
    x.type==="credit" ? "उधारी" :
    x.type==="collection" ? "वसूली" :
    x.type==="cash" ? "कैश" :
    "UPI / Paytm";

  return `
  <div class="transaction">
    <h3>${escapeHTML(x.name)}
      <small>${title}</small>
    </h3>

    <div class="amount">${money(x.amount)}</div>

    <p>
      📅 ${x.date} • ${x.time}<br>
      📱 ${escapeHTML(x.mobile || "-")}
    </p>

    ${x.note ? `<p>${escapeHTML(x.note)}</p>` : ""}
  </div>
  `;
}

function renderCustomers(){

  let search=document.getElementById("search")
    .value.toLowerCase();

  let customers={};

  data.forEach(x=>{

    let key=x.name+"_"+x.mobile;

    if(!customers[key]){
      customers[key]={
        name:x.name,
        mobile:x.mobile,
        balance:0
      };
    }

    if(x.type==="credit")
      customers[key].balance+=x.amount;

    if(x.type==="collection")
      customers[key].balance-=x.amount;
  });

  let list=Object.values(customers)
    .filter(c=>
      c.name.toLowerCase().includes(search) ||
      c.mobile.includes(search)
    )
    .filter(c=>c.balance>0);

  let box=document.getElementById("customerList");

  if(!list.length){
    box.innerHTML=
      '<div class="empty">कोई ग्राहक नहीं मिला</div>';
    return;
  }

  box.innerHTML=list.map(c=>`

  <div class="customer">

    <h3>${escapeHTML(c.name)}</h3>

    <p>📱 ${escapeHTML(c.mobile || "-")}</p>

    <div class="balance">
      🔴 बाकी: ${money(c.balance)}
    </div>

    <p>
      कुल उधारी: ${money(
        data.filter(x=>
          x.name===c.name &&
          x.mobile===c.mobile &&
          x.type==="credit"
        ).reduce((a,b)=>a+b.amount,0)
      )}
    </p>

    <div class="actions">

      <button onclick="collect('${safe(c.name)}','${safe(c.mobile)}')">
        💵 वसूली
      </button>

      <button onclick="whatsapp('${safe(c.name)}','${safe(c.mobile)}',${c.balance})">
        📱 WhatsApp
      </button>

      <button onclick="historyCustomer('${safe(c.name)}','${safe(c.mobile)}')">
        📋 हिसाब देखें
      </button>

    </div>

  </div>

  `).join("");
}

function collect(name,mobile){

  let amount=prompt(
    "कितनी वसूली हुई?",
    "500"
  );

  amount=Number(amount);

  if(!amount || amount<=0)return;

  data.push({
    id:Date.now(),
    date:today(),
    time:new Date().toLocaleTimeString("en-IN"),
    type:"collection",
    name,
    mobile,
    amount,
    note:"उधारी की वसूली"
  });

  save();
  renderCustomers();
  renderDashboard();

  alert("वसूली सेव हो गई ✅");
}

function whatsapp(name,mobile,balance){

  if(!mobile){
    alert("इस ग्राहक का मोबाइल नंबर नहीं है");
    return;
  }

  let msg=
`नमस्ते ${name} जी,

Shree PrabhuRaj Indian Oil

आपकी वर्तमान उधारी बाकी:
${money(balance)}

कृपया समय पर भुगतान करें।

धन्यवाद 🙏`;

  window.open(
    "https://wa.me/91"+mobile+
    "?text="+encodeURIComponent(msg),
    "_blank"
  );
}

function historyCustomer(name,mobile){

  let records=data.filter(x=>
    x.name===name && x.mobile===mobile
  );

  let text=records.map(x=>
    `${x.date} ${x.time} - ${
      x.type==="credit"?"उधारी":"वसूली"
    } ${money(x.amount)}`
  ).join("\n");

  alert(
    "📋 "+name+
    "\n\n"+text
  );
}

function renderReport(){

  let date=document.getElementById("reportDate").value;

  let list=data.filter(x=>x.date===date);

  let credit=sumType(list,"credit");
  let collection=sumType(list,"collection");
  let cash=sumType(list,"cash");
  let upi=sumType(list,"upi");

  document.getElementById("reportCredit").textContent=
    money(credit);

  document.getElementById("reportCollection").textContent=
    money(collection);

  document.getElementById("reportCash").textContent=
    money(cash);

  document.getElementById("reportUpi").textContent=
    money(upi);

  let box=document.getElementById("reportTransactions");

  if(!list.length){
    box.innerHTML=
      '<div class="empty">इस तारीख को कोई लेन-देन नहीं है</div>';
    return;
  }

  box.innerHTML=list
    .slice()
    .reverse()
    .map(transactionHTML)
    .join("");
}

function sumType(list,type){

  return list
    .filter(x=>x.type===type)
    .reduce((a,b)=>a+b.amount,0);
}

function escapeHTML(str){

  return String(str)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function safe(str){

  return String(str)
    .replaceAll("'","\\'")
    .replaceAll('"','\\"');
}

renderDashboard();

</script>

</body>
</html>
