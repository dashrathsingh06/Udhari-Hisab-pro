<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Udhari Hisab Pro</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  color:#172033;
}

header{
  background:linear-gradient(135deg,#0b57d0,#174ea6);
  color:white;
  padding:22px 16px;
  text-align:center;
}

header h1{
  margin:0;
  font-size:27px;
}

header p{
  margin:7px 0 0;
  opacity:.9;
}

.container{
  max-width:600px;
  margin:auto;
  padding:15px;
}

.card{
  background:white;
  border-radius:16px;
  padding:18px;
  margin-bottom:15px;
  box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.card h2{
  margin-top:0;
  font-size:20px;
}

input{
  width:100%;
  padding:13px;
  border:1px solid #d7dce5;
  border-radius:10px;
  margin:7px 0;
  font-size:16px;
}

button{
  width:100%;
  padding:13px;
  border:0;
  border-radius:10px;
  background:#0b57d0;
  color:white;
  font-size:16px;
  font-weight:bold;
  margin-top:8px;
}

button.delete{
  background:#dc3545;
}

.summary{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.box{
  padding:15px;
  border-radius:12px;
  background:#eef4ff;
  text-align:center;
}

.box strong{
  display:block;
  font-size:22px;
  margin-top:5px;
}

.person{
  border:1px solid #e1e5eb;
  border-radius:12px;
  padding:14px;
  margin-top:10px;
}

.person-name{
  font-weight:bold;
  font-size:18px;
}

.amount{
  color:#dc3545;
  font-weight:bold;
  margin-top:5px;
}

.empty{
  text-align:center;
  color:#777;
  padding:20px;
}

footer{
  text-align:center;
  padding:20px;
  color:#777;
  font-size:13px;
}
</style>
</head>

<body>

<header>
  <h1>💰 Udhari Hisab Pro</h1>
  <p>उधारी का हिसाब आसान और सुरक्षित</p>
</header>

<div class="container">

  <div class="card">
    <h2>➕ नई उधारी जोड़ें</h2>

    <input id="name" type="text" placeholder="ग्राहक का नाम">

    <input id="mobile" type="tel" placeholder="मोबाइल नंबर">

    <input id="amount" type="number" placeholder="रकम ₹">

    <input id="note" type="text" placeholder="नोट / सामान">

    <button onclick="addUdhari()">उधारी जोड़ें</button>
  </div>

  <div class="card">
    <h2>📊 कुल हिसाब</h2>

    <div class="summary">
      <div class="box">
        ग्राहक
        <strong id="totalPeople">0</strong>
      </div>

      <div class="box">
        कुल उधारी
        <strong>₹<span id="totalAmount">0</span></strong>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>📋 उधारी की सूची</h2>
    <div id="list">
      <div class="empty">अभी कोई उधारी नहीं है।</div>
    </div>
  </div>

</div>

<footer>
  Udhari Hisab Pro © 2026
</footer>

<script>

let udhari = JSON.parse(localStorage.getItem("udhariData")) || [];

function saveData(){
  localStorage.setItem("udhariData", JSON.stringify(udhari));
}

function addUdhari(){

  const name = document.getElementById("name").value.trim();
  const mobile = document.getElementById("mobile").value.trim();
  const amount = Number(document.getElementById("amount").value);
  const note = document.getElementById("note").value.trim();

  if(!name){
    alert("कृपया ग्राहक का नाम डालें।");
    return;
  }

  if(!amount || amount <= 0){
    alert("कृपया सही रकम डालें।");
    return;
  }

  udhari.push({
    id:Date.now(),
    name:name,
    mobile:mobile,
    amount:amount,
    note:note,
    date:new Date().toLocaleDateString("hi-IN")
  });

  saveData();

  document.getElementById("name").value="";
  document.getElementById("mobile").value="";
  document.getElementById("amount").value="";
  document.getElementById("note").value="";

  showData();
}

function deleteUdhari(id){

  if(confirm("क्या आप यह उधारी हटाना चाहते हैं?")){
    udhari = udhari.filter(item => item.id !== id);
    saveData();
    showData();
  }
}

function showData(){

  const list = document.getElementById("list");

  document.getElementById("totalPeople").textContent = udhari.length;

  const total = udhari.reduce((sum,item)=>sum + item.amount,0);

  document.getElementById("totalAmount").textContent =
    total.toLocaleString("en-IN");

  if(udhari.length === 0){
    list.innerHTML =
      '<div class="empty">अभी कोई उधारी नहीं है।</div>';
    return;
  }

  list.innerHTML = "";

  udhari.slice().reverse().forEach(item=>{

    const div = document.createElement("div");

    div.className="person";

    div.innerHTML=`
      <div class="person-name">👤 ${escapeHtml(item.name)}</div>

      ${item.mobile ?
      `<div>📞 ${escapeHtml(item.mobile)}</div>` : ""}

      <div class="amount">
        उधारी: ₹${item.amount.toLocaleString("en-IN")}
      </div>

      ${item.note ?
      `<div>📝 ${escapeHtml(item.note)}</div>` : ""}

      <div style="font-size:12px;color:#777;margin-top:5px;">
        📅 ${item.date}
      </div>

      <button class="delete" onclick="deleteUdhari(${item.id})">
        उधारी हटाएँ
      </button>
    `;

    list.appendChild(div);
  });
}

function escapeHtml(text){
  const div=document.createElement("div");
  div.textContent=text;
  return div.innerHTML;
}

showData();

</script>

</body>
</html>
